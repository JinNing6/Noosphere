name: Route Shared Skill evidence PRs

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/skill_evidence_pr_adapter.yml
      - .github/scripts/skill-evidence-pr-adapter.cjs
  workflow_dispatch:

concurrency:
  group: skill-evidence-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  route_root_skill:
    name: Inspect evidence-only Skill contribution
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout trusted repository revision only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Inspect untrusted text without executing it
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {
              COMMENT_MARKER,
              inspectSkillEvidencePullRequest,
              listPullRequestsForReconciliation,
              renderSkillEvidencePullRequestComment,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/skill-evidence-pr-adapter.cjs`);
            const labelDefinitions = [
              ['skill-evidence-pr-routed', '8250DF', 'Skill contribution routed to the evidence intake form'],
              ['skill-evidence-incomplete', 'B60205', 'Skill evidence is missing required fields or public sources'],
            ];
            const routeLabelNames = labelDefinitions.map(([name]) => name);
            const pullRequests = await listPullRequestsForReconciliation({
              eventName: context.eventName,
              eventPullRequest: context.payload.pull_request,
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            console.log(`Reconciling ${pullRequests.length} open pull request(s) for ${context.eventName}.`);

            async function reconcilePullRequest(pullRequest) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const existing = comments.find((comment) => (
                comment?.user?.login === 'github-actions[bot]' &&
                String(comment.body || '').includes(COMMENT_MARKER)
              ));
              const currentLabels = new Set((pullRequest.labels || []).map((label) => (
                typeof label === 'string' ? label : label.name
              )));
              const rootSkillFiles = files.filter((file) => (
                String(file.filename || '').toLowerCase() === 'skill.md' && file.status !== 'removed'
              ));
              if (!rootSkillFiles.length) {
                if (existing && !String(existing.body || '').includes('Status: resolved')) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: `Status: resolved — this PR no longer adds a repository-root SKILL.md.\n\n${COMMENT_MARKER}`,
                  });
                }
                for (const name of routeLabelNames.filter((label) => currentLabels.has(label))) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pullRequest.number,
                      name,
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                console.log(`PR #${pullRequest.number}: no repository-root SKILL.md contribution.`);
                return;
              }

              const fileContents = {};
              for (const file of rootSkillFiles) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: file.filename,
                    ref: pullRequest.head.sha,
                  });
                  if (!Array.isArray(response.data) && response.data.type === 'file' && response.data.size <= 200000) {
                    fileContents[file.filename] = Buffer.from(response.data.content || '', 'base64').toString('utf8');
                  }
                } catch (error) {
                  console.log(`PR #${pullRequest.number}: could not read ${file.filename} as public text (${error.status || 'unknown'}).`);
                  fileContents[file.filename] = String(file.patch || '');
                }
              }

              const result = inspectSkillEvidencePullRequest({ files, fileContents });
              if (!result.relevant) return;

              const formUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?template=skill-proposal.yml`;
              const body = renderSkillEvidencePullRequestComment(result, { formUrl });
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }

              for (const [name, color, description] of labelDefinitions) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: result.labels,
              });
              console.log(`PR #${pullRequest.number}: routed to the Shared Skill evidence form.`);
            }

            let failures = 0;
            for (const pullRequest of pullRequests) {
              try {
                await reconcilePullRequest(pullRequest);
              } catch (error) {
                failures += 1;
                core.warning(`PR #${pullRequest.number} reconciliation failed: ${error.message}`);
              }
            }
            if (failures) core.setFailed(`${failures} pull request reconciliation(s) failed.`);
