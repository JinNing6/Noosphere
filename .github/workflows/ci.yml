name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant file changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          git diff --name-only "$merge_base" "$head_sha" > /tmp/changed_files
          echo "Changed files:"
          cat /tmp/changed_files

          if grep -Eq '^(frontend/|package-lock\.json|package\.json|vite\.config|tsconfig|eslint\.config)' /tmp/changed_files; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(\.github/scripts/|\.github/workflows/(consciousness_promote|consciousness_withdraw|skill_publish|skill_withdraw)\.yml|shared_skills/|plugins/(noosphere|claude-noosphere)/skills/|SKILLS_PROTOCOL\.md|scripts/(validate_shared_skills|test_validate_shared_skills|migrate_consciousness_promotions|test_migrate_consciousness_promotions)\.py)' /tmp/changed_files; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(sdk/|backend/|pyproject\.toml|ruff\.toml|scripts/.*\.py)' /tmp/changed_files; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript compile and Vite build
        run: npm run build

  python-check:
    name: Python Tests & Critical Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK development dependencies
        run: pip install -e "./sdk[dev]"

      - name: SDK and repository tests
        run: |
          python -m pytest sdk/tests
          python -m unittest scripts.test_validate_shared_skills scripts.test_migrate_consciousness_promotions

      - name: Syntax and undefined-name gate
        run: |
          if [ -d backend ]; then
            cd backend
            ruff check . --select E9,F63,F7,F82
            cd ..
          fi
          cd sdk
          ruff check . --select E9,F63,F7,F82

      - name: Shared Skill Python lint
        run: |
          cd sdk
          ruff check noosphere/engine/memory_integrity.py noosphere/engine/shared_skills.py tests/test_memory_integrity.py tests/test_build_consciousness_index.py tests/test_shared_skills.py
          ruff format --check noosphere/engine/memory_integrity.py noosphere/engine/shared_skills.py tests/test_memory_integrity.py tests/test_build_consciousness_index.py tests/test_shared_skills.py

      - name: Repository validator lint
        run: |
          ruff check scripts/validate_shared_skills.py scripts/test_validate_shared_skills.py scripts/migrate_consciousness_promotions.py scripts/test_migrate_consciousness_promotions.py
          ruff format --check scripts/validate_shared_skills.py scripts/test_validate_shared_skills.py scripts/migrate_consciousness_promotions.py scripts/test_migrate_consciousness_promotions.py

  shared-skill-check:
    name: Shared Skill Supply Chain
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK development dependencies
        run: pip install -e "./sdk[dev]"

      - name: Workflow unit tests
        run: node --test .github/scripts/*.test.cjs

      - name: Registry and Agent Skills validation
        run: |
          python -m unittest scripts.test_validate_shared_skills scripts.test_migrate_consciousness_promotions
          python scripts/validate_shared_skills.py
          python scripts/migrate_consciousness_promotions.py --check
