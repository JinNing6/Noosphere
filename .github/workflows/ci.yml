name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
      shared: ${{ steps.filter.outputs.shared }}
      experience: ${{ steps.filter.outputs.experience }}
      glama: ${{ steps.filter.outputs.glama }}
      validation: ${{ steps.filter.outputs.validation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant file changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          git diff --name-only "$merge_base" "$head_sha" > /tmp/changed_files
          echo "Changed files:"
          cat /tmp/changed_files

          if grep -Eq '^(frontend/|package-lock\.json|package\.json|vite\.config|tsconfig|eslint\.config)' /tmp/changed_files; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(EXPERIENCE_PROTOCOL\.md|experience_records/|schemas/experience-record-|scripts/(validate_experience_records|test_validate_experience_records)\.py|\.github/(ISSUE_TEMPLATE/experience-record\.yml|scripts/experience-intake\.(cjs|test\.cjs)|workflows/experience_intake\.yml))' /tmp/changed_files; then
            echo "experience=true" >> "$GITHUB_OUTPUT"
          else
            echo "experience=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(\.github/scripts/|\.github/workflows/(backfill_embeddings|consciousness_promote|consciousness_withdraw|skill_evidence_pr_adapter|skill_outcome|skill_publish|skill_withdraw)\.yml|shared_skills/|plugins/(noosphere|claude-noosphere)/|SKILLS_PROTOCOL\.md|scripts/(validate_shared_skills|test_validate_shared_skills|migrate_consciousness_promotions|test_migrate_consciousness_promotions)\.py)' /tmp/changed_files; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(sdk/|backend/|pyproject\.toml|ruff\.toml|scripts/.*\.py)' /tmp/changed_files; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(Dockerfile|\.dockerignore|glama\.json|server\.json|smithery\.yaml|sdk/)' /tmp/changed_files; then
            echo "glama=true" >> "$GITHUB_OUTPUT"
          else
            echo "glama=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(sdk/noosphere/validation_|sdk/tests/test_validation_cli\.py|examples/reproductions/public-artifact-runtime-smoke-gate/|\.github/ISSUE_TEMPLATE/validate-skill\.yml|\.github/workflows/ci\.yml|scripts/(check_validation_result|test_check_validation_result|verify_pypi_release|test_verify_pypi_release)\.py)' /tmp/changed_files; then
            echo "validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "validation=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript compile and Vite build
        run: npm run build

  python-check:
    name: Python Tests & Critical Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK development dependencies
        run: pip install -e "./sdk[dev]"

      - name: SDK and repository tests
        run: |
          python -m pytest sdk/tests
          python -m unittest scripts.test_validate_shared_skills scripts.test_validate_experience_records scripts.test_migrate_consciousness_promotions scripts.test_launch_surface scripts.test_check_validation_result

      - name: Syntax and undefined-name gate
        run: |
          if [ -d backend ]; then
            cd backend
            ruff check . --select E9,F63,F7,F82
            cd ..
          fi
          cd sdk
          ruff check . --select E9,F63,F7,F82

      - name: Shared Skill Python lint
        run: |
          cd sdk
          ruff check noosphere/engine/memory_integrity.py noosphere/engine/shared_skills.py tests/test_memory_integrity.py tests/test_build_consciousness_index.py tests/test_shared_skills.py
          ruff format --check noosphere/engine/memory_integrity.py noosphere/engine/shared_skills.py tests/test_memory_integrity.py tests/test_build_consciousness_index.py tests/test_shared_skills.py

      - name: Repository validator lint
        run: |
          ruff check scripts/validate_shared_skills.py scripts/test_validate_shared_skills.py scripts/validate_experience_records.py scripts/test_validate_experience_records.py scripts/migrate_consciousness_promotions.py scripts/test_migrate_consciousness_promotions.py
          ruff format --check scripts/validate_shared_skills.py scripts/test_validate_shared_skills.py scripts/validate_experience_records.py scripts/test_validate_experience_records.py scripts/migrate_consciousness_promotions.py scripts/test_migrate_consciousness_promotions.py

  shared-skill-check:
    name: Shared Skill Supply Chain
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK development dependencies
        run: pip install -e "./sdk[dev]"

      - name: Workflow unit tests
        run: node --test .github/scripts/*.test.cjs

      - name: Registry and Agent Skills validation
        run: |
          python -m unittest scripts.test_validate_shared_skills scripts.test_migrate_consciousness_promotions
          python scripts/validate_shared_skills.py
          python scripts/migrate_consciousness_promotions.py --check

  experience-record-check:
    name: Experience Protocol v0.1
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.experience == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Validate schema, records, and policy invariants
        run: |
          node --test .github/scripts/experience-intake.test.cjs
          python -m unittest scripts.test_validate_experience_records
          python scripts/validate_experience_records.py

  validation-kit-matrix:
    name: 60s Validation Kit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: needs.detect-changes.outputs.validation == 'true'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the validation command
        run: pip install -e "./sdk[dev]"

      - name: Run the exact token-free validation path
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: noosphere-validate public-artifact-runtime-smoke-gate --format json --output validation-result.json

      - name: Enforce the 60-second and prefilled-form contracts
        run: python scripts/check_validation_result.py validation-result.json

  glama-container-check:
    name: Glama Container MCP Discovery
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.glama == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Glama source container
        run: docker build --pull --tag noosphere-glama:ci .

      - name: Verify anonymous server/discover + tools/list and initialize + tools/list
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          from scripts.verify_pypi_release import (
              LEGACY_MCP_PROTOCOL_VERSION,
              MODERN_MCP_PROTOCOL_VERSION,
              parse_mcp_probe_output,
              probe_mcp_subprocess,
          )

          pyproject = Path("sdk/pyproject.toml").read_text(encoding="utf-8")
          version_match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          if not version_match:
              raise RuntimeError("Could not determine Noosphere version")

          for protocol_version in (
              MODERN_MCP_PROTOCOL_VERSION,
              LEGACY_MCP_PROTOCOL_VERSION,
          ):
              completed = probe_mcp_subprocess(
                  [
                      "docker",
                      "run",
                      "--rm",
                      "--interactive",
                      "--network",
                      "none",
                      "noosphere-glama:ci",
                  ],
                  timeout_seconds=30,
                  protocol_version=protocol_version,
              )

              result = parse_mcp_probe_output(
                  completed["stdout"],
                  expected_version=version_match.group(1),
                  expected_tool_count=46,
                  protocol_version=protocol_version,
              )
              print(
                  f"Verified Glama source container with {protocol_version}: "
                  f"{result['runtime_tool_count']} tools, "
                  f"serverInfo.version={result['server_version']}"
              )
          PY
