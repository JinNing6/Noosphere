name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant file changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          git diff --name-only "$merge_base" "$head_sha" > /tmp/changed_files
          echo "Changed files:"
          cat /tmp/changed_files

          if grep -Eq '^(frontend/|package-lock\.json|package\.json|vite\.config|tsconfig|eslint\.config)' /tmp/changed_files; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(sdk/|backend/|pyproject\.toml|ruff\.toml|scripts/.*\.py)' /tmp/changed_files; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript compile and Vite build
        run: npm run build

  python-check:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install ruff

      - name: Backend lint
        run: |
          if [ -d backend ]; then
            cd backend
            ruff check .
          else
            echo "backend/ directory is not present; skipping backend lint."
          fi

      - name: Backend format
        run: |
          if [ -d backend ]; then
            cd backend
            ruff format --check .
          else
            echo "backend/ directory is not present; skipping backend format check."
          fi

      - name: SDK lint
        run: |
          cd sdk
          ruff check .

      - name: SDK format
        run: |
          cd sdk
          ruff format --check .
