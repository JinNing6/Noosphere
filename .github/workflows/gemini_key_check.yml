name: Gemini Key Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate Gemini embedding key
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Gemini embedding key probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-001
        run: node .github/scripts/gemini-embedding.cjs check
