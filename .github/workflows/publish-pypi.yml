name: Publish noosphere-mcp to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and dev quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run SDK release tests
        run: python -m pytest tests/test_noosphere_mcp.py tests/test_vector_store.py tests/test_preflight.py tests/test_release_boundary.py

      - name: Run PyPI verifier tests
        working-directory: .
        run: python -m unittest scripts.test_verify_pypi_release

      - name: Verify MCP server import
        run: python -c "import noosphere.noosphere_mcp as server; assert server.mcp is not None"

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: noosphere-mcp-dist
          path: sdk/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noosphere-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: noosphere-mcp-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify PyPI install
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify published PyPI package
        run: python scripts/verify_pypi_release.py --tool-count 40

  refresh-pages-proof:
    name: Refresh Pages traction proof
    needs: verify-pypi
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build consciousness index
        run: python scripts/build_consciousness_index.py

      - name: Build share proof index
        run: python scripts/build_share_proof_index.py

      - name: Build traction proof after PyPI verification
        run: python scripts/build_traction_proof.py

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload refreshed Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy refreshed Pages
        id: deployment
        uses: actions/deploy-pages@v4
