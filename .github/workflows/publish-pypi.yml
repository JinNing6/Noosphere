name: Publish noosphere-mcp to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and dev quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run SDK release tests
        run: python -m pytest tests/test_noosphere_mcp.py tests/test_vector_store.py tests/test_preflight.py tests/test_release_boundary.py

      - name: Verify MCP server import
        run: python -c "import noosphere.noosphere_mcp as server; assert server.mcp is not None"

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: noosphere-mcp-dist
          path: sdk/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noosphere-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: noosphere-mcp-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
