name: Publish Reviewed Shared Skill

on:
  issues:
    types: [labeled]

concurrency:
  group: noosphere-main-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.label.name == 'skill-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest registry
        uses: actions/checkout@v4

      - name: Refresh serialized Skill state
        run: |
          git fetch origin main
          git checkout -B skill-publish origin/main

      - name: Validate reviewer and stage immutable Skill release
        id: publish
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {
              extractSkillCandidate,
              publishCandidate,
              rebuildCandidateFromCanonicalEvidence,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dynamic-skills.cjs`);
            const {
              loadCandidatePayloads,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resonance-neighbors.cjs`);
            const {
              isTrustedReviewerPermission,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/memory-trust.cjs`);

            const issue = context.payload.issue;
            const reviewer = context.payload.sender?.login || context.actor;
            const issueLabels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name);
            if (!issueLabels.includes('skill-candidate')) {
              core.setFailed('Only an Issue labeled skill-candidate can be published.');
              return;
            }
            if (issue.user?.login !== 'github-actions[bot]') {
              core.setFailed(`Skill candidate Issue must be created by github-actions[bot], not ${issue.user?.login || 'unknown'}.`);
              return;
            }
            const permissionResponse = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: reviewer,
            });
            if (!isTrustedReviewerPermission(permissionResponse.data.permission)) {
              core.setFailed(`Reviewer ${reviewer} does not have repository write permission.`);
              return;
            }

            const reviewedCandidate = extractSkillCandidate(issue.body);
            if (!reviewedCandidate) {
              core.setFailed('The Issue does not contain a valid structured Skill candidate.');
              return;
            }
            const memories = loadCandidatePayloads(path.join(process.env.GITHUB_WORKSPACE, 'consciousness_payloads'));
            const tombstonesPath = path.join(process.env.GITHUB_WORKSPACE, 'consciousness_tombstones.json');
            const tombstones = fs.existsSync(tombstonesPath)
              ? JSON.parse(fs.readFileSync(tombstonesPath, 'utf8'))
              : { version: 1, withdrawn_issues: [] };
            let candidate;
            try {
              candidate = rebuildCandidateFromCanonicalEvidence(
                reviewedCandidate,
                memories,
                tombstones,
              );
            } catch (error) {
              core.setFailed(`Canonical Skill evidence validation failed: ${error.message}`);
              return;
            }
            const registryPath = path.join(process.env.GITHUB_WORKSPACE, 'shared_skills', 'registry.json');
            const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
            const published = publishCandidate(registry, candidate, {
              reviewer,
              publishedAt: new Date().toISOString(),
            });
            core.setOutput('idempotent', String(published.idempotent));
            core.setOutput('skill_name', candidate.name);
            core.setOutput('version', published.release.version);
            core.setOutput('sha256', published.release.artifact.sha256);
            if (published.idempotent) return;

            const releasePath = published.release.artifact.path;
            const absoluteReleasePath = path.join(process.env.GITHUB_WORKSPACE, releasePath);
            if (fs.existsSync(absoluteReleasePath)) {
              const existingContent = fs.readFileSync(absoluteReleasePath, 'utf8');
              if (existingContent !== published.skillMarkdown) {
                core.setFailed(`Immutable release path already exists with different content: ${releasePath}`);
                return;
              }
            } else {
              fs.mkdirSync(path.dirname(absoluteReleasePath), { recursive: true });
              fs.writeFileSync(absoluteReleasePath, published.skillMarkdown);
            }

            const activePath = path.join(
              process.env.GITHUB_WORKSPACE,
              'shared_skills',
              'active',
              candidate.name,
              'SKILL.md',
            );
            fs.mkdirSync(path.dirname(activePath), { recursive: true });
            fs.writeFileSync(activePath, published.skillMarkdown);
            fs.writeFileSync(registryPath, `${JSON.stringify(published.registry, null, 2)}\n`);

      - name: Validate staged Skill supply chain
        if: steps.publish.outputs.idempotent != 'true'
        run: python scripts/validate_shared_skills.py

      - name: Commit Skill release atomically
        if: steps.publish.outputs.idempotent != 'true'
        run: |
          git diff --check
          git config user.name "Noosphere Bot"
          git config user.email "noosphere@consciousness.network"
          git add -A shared_skills
          git commit -m "Publish shared Skill ${{ steps.publish.outputs.skill_name }}@${{ steps.publish.outputs.version }}"
          git push origin HEAD:main

      - name: Record publication decision
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const idempotent = '${{ steps.publish.outputs.idempotent }}' === 'true';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['skill-published'],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'needs-review',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: idempotent
                ? `Skill ${{ steps.publish.outputs.skill_name }}@${{ steps.publish.outputs.version }} is already published.`
                : `Published ${{ steps.publish.outputs.skill_name }}@${{ steps.publish.outputs.version }}. Artifact SHA-256: ${{ steps.publish.outputs.sha256 }}`,
            });
