name: Backfill Gemini Embeddings

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of payload files to backfill in this run. Use 0 for all.
        required: false
        default: "50"
      dry_run:
        description: Check payloads without committing embedding changes.
        required: false
        type: boolean
        default: false
      force:
        description: Regenerate embeddings even when a payload already has one.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: noosphere-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    name: Backfill historical payload embeddings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate missing embeddings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          for payload_dir in consciousness_payloads skill_evidence_payloads; do
            args=(backfill --dir "$payload_dir")
            if [ -n "$BACKFILL_LIMIT" ]; then
              args+=(--limit "$BACKFILL_LIMIT")
            fi
            if [ "$BACKFILL_DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            if [ "$BACKFILL_FORCE" = "true" ]; then
              args+=(--force)
            fi
            node .github/scripts/gemini-embedding.cjs "${args[@]}"
          done

      - name: Commit embedding updates
        env:
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$BACKFILL_DRY_RUN" = "true" ]; then
            echo "Dry run requested; skipping commit."
            exit 0
          fi

          if git diff --quiet -- consciousness_payloads skill_evidence_payloads; then
            echo "No embedding changes to commit."
            exit 0
          fi

          git config user.name "Noosphere Bot"
          git config user.email "noosphere-bot@users.noreply.github.com"
          git add consciousness_payloads skill_evidence_payloads
          git commit -m "Backfill Gemini embeddings"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild review candidates from canonical evidence
        if: inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const {
              renderSkillCandidateBody,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dynamic-skills.cjs`);
            const {
              loadCandidatePayloads,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resonance-neighbors.cjs`);
            const {
              buildCanonicalSkillCandidates,
              planCandidateIssueSync,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/skill-candidate-sync.cjs`);
            const {
              isTrustedReviewerPermission,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/memory-trust.cjs`);
            const memories = [
              `${process.env.GITHUB_WORKSPACE}/consciousness_payloads`,
              `${process.env.GITHUB_WORKSPACE}/skill_evidence_payloads`,
            ].flatMap((directory) => loadCandidatePayloads(directory));
            const tombstonesPath = `${process.env.GITHUB_WORKSPACE}/consciousness_tombstones.json`;
            const tombstones = fs.existsSync(tombstonesPath)
              ? JSON.parse(fs.readFileSync(tombstonesPath, 'utf8'))
              : { version: 1, withdrawn_issues: [] };
            const rebuiltCandidates = buildCanonicalSkillCandidates(memories, tombstones);
            const candidates = [];
            for (const candidate of rebuiltCandidates) {
              if (candidate.publication_track === 'maintainer') {
                const publisherPermission = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: candidate.publishers[0],
                });
                if (!isTrustedReviewerPermission(publisherPermission.data.permission)) {
                  console.log(`Skipping maintainer candidate ${candidate.id}: publisher lacks write permission.`);
                  continue;
                }
              }
              candidates.push(candidate);
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              labels: 'skill-candidate',
              per_page: 100,
            });
            const plan = planCandidateIssueSync(candidates, issues);
            for (const candidate of plan.create) {
              await github.rest.issues.create({
                ...context.repo,
                title: `Skill candidate: ${candidate.name}`,
                body: renderSkillCandidateBody(candidate),
                labels: ['skill-candidate', 'needs-review'],
              });
            }
            for (const entry of plan.update) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: entry.issue.number,
                title: `Skill candidate: ${entry.candidate.name}`,
                body: renderSkillCandidateBody(entry.candidate),
                state: 'open',
                labels: ['skill-candidate', 'needs-review'],
              });
            }
            for (const issue of plan.supersede) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: ['skill-candidate', 'skill-candidate-superseded'],
              });
            }
