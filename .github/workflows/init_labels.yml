name: 🏷️ Initialize Consciousness Labels (意识标签初始化)

# Run manually or on first push to set up labels
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create_labels:
    name: 🏷️ Create Consciousness Labels
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Create Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: 'consciousness', color: '7B68EE', description: '🧠 Consciousness payload' },
              { name: 'ephemeral', color: 'FFD700', description: '⚡ Ephemeral consciousness / 瞬时意识体' },
              { name: 'promoted', color: '00FF88', description: '✨ Promoted to permanent / 已晋升常驻' },
              { name: 'filtered', color: 'FF6666', description: '🚫 Filtered by CI / 已过滤' },
              { name: 'type:epiphany', color: '9B59B6', description: '💠 Epiphany / 顿悟' },
              { name: 'type:decision', color: '3498DB', description: '⚖️ Decision / 决策' },
              { name: 'type:pattern', color: '1ABC9C', description: '🌌 Pattern / 规律' },
              { name: 'type:warning', color: 'E74C3C', description: '👁️ Warning / 警示' },
              { name: 'share-proof', color: '2EA44F', description: 'Public Noosphere share proof' },
              { name: 'needs-review', color: 'FBCA04', description: 'Requires trusted maintainer review' },
              { name: 'trusted-review', color: '0E8A16', description: 'Reviewed by a repository maintainer' },
              { name: 'skill-candidate', color: '5319E7', description: 'Dynamic shared Skill candidate' },
              { name: 'skill-approved', color: '0E8A16', description: 'Shared Skill candidate approved for publication' },
              { name: 'skill-published', color: '1D76DB', description: 'Versioned shared Skill release published' },
              { name: 'skill-outcome', color: 'BFDADC', description: 'Structured shared Skill execution outcome' },
              { name: 'needs-outcome-review', color: 'FBCA04', description: 'Structured Skill outcome awaiting maintainer review' },
              { name: 'skill-outcome-approved', color: '0E8A16', description: 'Structured Skill outcome approved by a maintainer' },
              { name: 'skill-outcome-recorded', color: '1D76DB', description: 'Approved Skill outcome recorded in the public ledger' },
              { name: 'skill-outcome-invalid', color: 'B60205', description: 'Skill outcome failed canonical validation' },
              { name: 'skill-update-needed', color: 'D93F0B', description: 'Approved outcome indicates a Skill update is needed' },
              { name: 'skill-candidate-superseded', color: '6E7781', description: 'Candidate replaced after canonical evidence changed' },
              { name: 'skill-withdrawal', color: 'D93F0B', description: 'Shared Skill withdrawal request' },
              { name: 'skill-withdraw-approved', color: 'B60205', description: 'Shared Skill withdrawal approved by maintainer' },
              { name: 'skill-withdrawn', color: '000000', description: 'Shared Skill release withdrawn from active use' },
              { name: 'withdrawal-request', color: 'D93F0B', description: 'Permanent memory withdrawal request' },
              { name: 'withdrawn', color: '000000', description: 'Memory withdrawn from active indexes' },
              { name: '意识碎片', color: '00CED1', description: '🔮 Consciousness Fragment / 意识碎片' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                console.log(`✅ Created: ${label.name}`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`ℹ️ Already exists: ${label.name}`);
                  // Update color/description if already exists
                  try {
                    await github.rest.issues.updateLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description,
                    });
                    console.log(`  ↳ Updated: ${label.name}`);
                  } catch (updateErr) {
                    console.log(`  ↳ Could not update: ${updateErr.message}`);
                  }
                } else {
                  console.log(`❌ Error: ${label.name} - ${e.message}`);
                }
              }
            }
            console.log('\n🏷️ Label initialization complete!');
