name: 🌌 Consciousness Promotion (意识晋升流水线)

# Trigger on Issue creation or labeling. The job parses the Issue body and only
# promotes Issues that contain a recognized Noosphere payload.
on:
  issues:
    types: [opened, labeled]

concurrency:
  group: consciousness-promotion-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  promote_consciousness:
    name: 🧠 Validate & Promote Consciousness
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'

    steps:
      - name: 🌐 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛡️ AI Content Safety Check (NudeNet)
        id: content_safety
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const {
              extractConsciousnessPayload,
              getMediaModerationTarget,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-payload.cjs`);

            const extracted = extractConsciousnessPayload(body);
            if (!extracted) {
              console.log('No Noosphere payload found, skipping content safety.');
              return 'SKIP';
            }

            const mediaTarget = getMediaModerationTarget(extracted.payload);
            if (!mediaTarget) {
              console.log(`Payload source '${extracted.source}' is not visual media, skipping NudeNet.`);
              return 'SKIP';
            }

            // Set outputs for the Python step
            core.exportVariable('MEDIA_URL', mediaTarget.mediaUrl);
            core.exportVariable('MEDIA_TYPE', mediaTarget.mediaType);
            core.exportVariable('ISSUE_NUMBER', issue.number.toString());
            return 'CHECK';

      - name: 🔧 Install NudeNet
        if: steps.content_safety.outputs.result == 'CHECK'
        run: pip install nudenet opencv-python-headless

      - name: 🔍 Run NudeNet Moderation
        id: nudenet_check
        if: steps.content_safety.outputs.result == 'CHECK'
        run: |
          set +e
          RESULT=$(python scripts/content_moderation.py "$MEDIA_URL" --type "$MEDIA_TYPE" 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "result=$RESULT" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 1 ]; then
            echo "🚫 Content flagged as UNSAFE"
            echo "safe=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Content is SAFE"
            echo "safe=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Moderation error (fail-open, proceeding)"
            echo "safe=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚫 Reject Unsafe Content
        if: steps.content_safety.outputs.result == 'CHECK' && steps.nudenet_check.outputs.safe == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const modResult = '${{ steps.nudenet_check.outputs.result }}';

            let detailMsg = '';
            try {
              const parsed = JSON.parse(modResult);
              const unsafe = (parsed.unsafe_detections || []).map(d => `${d.label} (${d.score})`);
              detailMsg = unsafe.length > 0 ? `\n**Detected**: ${unsafe.join(', ')}` : '';
            } catch (e) { /* ignore parse error */ }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['rejected:unsafe']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🛡️ **Content Safety — Rejected by AI Moderation**\n\n` +
                    `Your multimedia consciousness was flagged by NudeNet AI content safety scanner.\n` +
                    `${detailMsg}\n\n` +
                    `If you believe this is a false positive, please open a discussion or contact the maintainers.\n\n` +
                    `*Powered by NudeNet — open-source content safety for the Noosphere.*`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

            core.setFailed('Content rejected: NSFW content detected');

      - name: 👁️ Extract, Validate & Promote Consciousness
        id: promote
        if: steps.content_safety.outputs.result != 'CHECK' || steps.nudenet_check.outputs.safe == 'true'
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const {
              extractConsciousnessPayload,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-payload.cjs`);
            const {
              applyEmbeddingToPayload,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/gemini-embedding.cjs`);
            const {
              findNearestResonanceMatch,
              loadCandidatePayloads,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resonance-neighbors.cjs`);
            const {
              buildPromotionComment,
              buildResonanceBacklinkComment,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-share-card.cjs`);

            // ── Step 1: Extract payload from Issue body ──
            const extracted = extractConsciousnessPayload(body);
            if (!extracted) {
              console.log('No Noosphere payload found, leaving Issue unchanged.');
              return;
            }

            const payload = extracted.payload;
            console.log(`Noosphere payload found via ${extracted.source}.`);

            // ── Step 2: Validate payload fields ──
            const VALID_TYPES = ['epiphany', 'decision', 'pattern', 'warning', 'image', 'video', 'voice'];
            const REQUIRED_FIELDS = ['creator_signature', 'consciousness_type', 'thought_vector_text', 'context_environment'];

            const missingFields = REQUIRED_FIELDS.filter(f => !payload[f]);
            if (missingFields.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ **Consciousness Filtered**: Missing required fields: ' + missingFields.join(', ')
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            if (!VALID_TYPES.includes(payload.consciousness_type)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Consciousness Filtered**: Invalid type '${payload.consciousness_type}'. Valid: ${VALID_TYPES.join(', ')}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            const context_env = String(payload.context_environment || '').trim();
            if (context_env.length < 10) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Consciousness Filtered**: Context too short (${context_env.length} chars, minimum 10).`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            // ── Step 3: Content Safety Check (OpenAI Moderation API) ──
            const openaiKey = process.env.OPENAI_API_KEY;
            if (openaiKey) {
              const textToModerate = `${payload.thought_vector_text}\n\n${payload.context_environment}`;
              try {
                const modResponse = await fetch('https://api.openai.com/v1/moderations', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${openaiKey}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ input: textToModerate }),
                });

                if (modResponse.ok) {
                  const modData = await modResponse.json();
                  const result = modData.results[0];

                  if (result.flagged) {
                    // Collect flagged categories
                    const flaggedCategories = Object.entries(result.categories)
                      .filter(([_, v]) => v === true)
                      .map(([k, _]) => k);

                    console.log(`🚫 Content flagged: ${flaggedCategories.join(', ')}`);

                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      labels: ['filtered']
                    });
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      body: `🛡️ **Consciousness Filtered by Content Safety**\n\n` +
                            `Your consciousness was flagged by content moderation.\n\n` +
                            `**Flagged categories**: ${flaggedCategories.join(', ')}\n\n` +
                            `If you believe this is a false positive, please open a discussion or contact the maintainers.`
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      state: 'closed'
                    });
                    return;
                  }
                  console.log('✅ Content safety check passed');
                } else {
                  console.log(`⚠️ Moderation API returned ${modResponse.status}, proceeding anyway (fail-open)`);
                }
              } catch (modErr) {
                console.log(`⚠️ Moderation API error: ${modErr.message}, proceeding anyway (fail-open)`);
              }
            } else {
              console.log('ℹ️ OPENAI_API_KEY not configured, skipping content safety check');
            }

            // ── Step 3.5: Gemini Embedding Generation ──
            const embeddingResult = await applyEmbeddingToPayload(payload, {
              apiKey: process.env.GEMINI_API_KEY,
              model: process.env.GEMINI_EMBEDDING_MODEL,
              fetchImpl: fetch,
            });

            if (embeddingResult.status === 'ok') {
              console.log(`Gemini embedding generated: ${embeddingResult.embedding.length} dimensions via ${embeddingResult.model}`);
            } else {
              console.log(`Gemini embedding skipped: ${embeddingResult.status}${embeddingResult.statusCode ? ` ${embeddingResult.statusCode}` : ''}`);
              if (embeddingResult.error) {
                console.log(embeddingResult.error.substring(0, 200));
              }
            }

            let resonanceMatch = null;
            if (embeddingResult.status === 'ok') {
              const candidatePayloads = loadCandidatePayloads(`${process.env.GITHUB_WORKSPACE}/consciousness_payloads`);
              resonanceMatch = findNearestResonanceMatch(payload, candidatePayloads, {
                excludeIssueNumber: issue.number,
              });

              if (resonanceMatch) {
                payload.resonates_with = [{
                  id: resonanceMatch.id,
                  score: resonanceMatch.score,
                  issue_number: resonanceMatch.issue_number,
                  type: resonanceMatch.type,
                }];
                console.log(`Nearest resonance found: issue #${resonanceMatch.issue_number} at ${Math.round(resonanceMatch.score * 100)}%`);
              } else {
                console.log('No embedding-backed resonance match found yet.');
              }
            }

            // ── Step 4: Promote — commit file to main branch ──
            const now = new Date();
            const timestamp = now.toISOString().replace(/[-:T]/g, '').substring(0, 15);
            const shortId = issue.number.toString().padStart(4, '0');
            const fileName = `${payload.consciousness_type}_${timestamp}_issue${shortId}.json`;
            const filePath = `consciousness_payloads/${fileName}`;

            // Add promotion metadata
            payload.promoted_from_issue = issue.number;
            payload.promoted_at = now.toISOString();

            const content = Buffer.from(
              JSON.stringify(payload, null, 2),
              'utf-8'
            ).toString('base64');

            const creator = payload.is_anonymous ? 'Anonymous Stalker' : payload.creator_signature;
            const typeEmojis = { epiphany: '💠', decision: '⚖️', pattern: '🌌', warning: '👁️', image: '🖼️', video: '🎬', voice: '🎵' };
            const emoji = typeEmojis[payload.consciousness_type] || '🧠';

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `${emoji} Promote Consciousness: [${payload.consciousness_type}] by ${creator} (Issue #${issue.number})`,
              content: content,
              committer: {
                name: 'Noosphere Bot',
                email: 'noosphere@consciousness.network'
              }
            });

            // ── Step 5: Close Issue with 'promoted' label ──
            // Remove 'ephemeral' label, add 'promoted'
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'ephemeral'
              });
            } catch (e) {
              // Label might not exist, that's OK
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['consciousness', 'promoted']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: buildPromotionComment({
                payload,
                issueNumber: issue.number,
                issueUrl: issue.html_url,
                filePath,
                promotedAt: now.toISOString(),
                emoji,
                resonanceMatch,
              })
            });

            if (resonanceMatch?.issue_number && resonanceMatch.issue_number !== issue.number) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: resonanceMatch.issue_number,
                  body: buildResonanceBacklinkComment({
                    payload,
                    newIssueNumber: issue.number,
                    newIssueUrl: issue.html_url,
                    resonanceMatch,
                  })
                });
                console.log(`Backlinked resonance to historical issue #${resonanceMatch.issue_number}`);
              } catch (backlinkErr) {
                console.log(`Could not backlink resonance to issue #${resonanceMatch.issue_number}: ${backlinkErr.message}`);
              }
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

            core.setOutput('promoted', 'true');
            console.log(`✅ Consciousness promoted: ${filePath} (Issue #${issue.number})`);

      - name: 📈 Sync public growth snapshot
        id: sync_public_growth
        if: steps.promote.outputs.promoted == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main

          python scripts/build_consciousness_index.py
          node frontend/scripts/update_readme_growth_snapshot.mjs
          git diff --check

          if git diff --quiet -- frontend/public/consciousness_index.json README.md docs/README_full.md; then
            echo "No public growth snapshot changes to commit."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "Noosphere Bot"
          git config user.email "noosphere@consciousness.network"
          git add frontend/public/consciousness_index.json README.md docs/README_full.md
          git commit -m "Sync public growth snapshot for promoted consciousness"
          git push origin HEAD:main
          echo "committed=true" >> $GITHUB_OUTPUT

      - name: 🚀 Dispatch Pages deploy
        if: steps.sync_public_growth.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
