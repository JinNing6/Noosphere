name: 🌌 Noosphere Contribution Promotion

# Trigger on Issue creation or labeling. The job parses the Issue body and only
# promotes Issues that contain a recognized Noosphere payload.
on:
  issues:
    types: [opened, edited, labeled]

concurrency:
  group: noosphere-main-writer
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  promote_consciousness:
    name: 🧠 Validate & Route Contribution
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.action == 'edited' || github.event.label.name == 'trusted-review')

    steps:
      - name: 🌐 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Refresh serialized promotion state
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: ⚙️ Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛡️ AI Content Safety Check (NudeNet)
        id: content_safety
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const {
              extractConsciousnessPayload,
              getMediaModerationTarget,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-payload.cjs`);

            const extracted = extractConsciousnessPayload(body);
            if (!extracted) {
              console.log('No Noosphere payload found, skipping content safety.');
              return 'SKIP';
            }

            const mediaTarget = getMediaModerationTarget(extracted.payload);
            if (!mediaTarget) {
              console.log(`Payload source '${extracted.source}' is not visual media, skipping NudeNet.`);
              return 'SKIP';
            }

            // Set outputs for the Python step
            core.exportVariable('MEDIA_URL', mediaTarget.mediaUrl);
            core.exportVariable('MEDIA_TYPE', mediaTarget.mediaType);
            core.exportVariable('ISSUE_NUMBER', issue.number.toString());
            return 'CHECK';

      - name: 🔧 Install NudeNet
        if: steps.content_safety.outputs.result == 'CHECK'
        run: pip install nudenet opencv-python-headless

      - name: 🔍 Run NudeNet Moderation
        id: nudenet_check
        if: steps.content_safety.outputs.result == 'CHECK'
        run: |
          set +e
          RESULT=$(python scripts/content_moderation.py "$MEDIA_URL" --type "$MEDIA_TYPE" 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "result=$RESULT" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 1 ]; then
            echo "🚫 Content flagged as UNSAFE"
            echo "safe=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Content is SAFE"
            echo "safe=true" >> $GITHUB_OUTPUT
          else
            echo "Moderation unavailable; the payload requires trusted review."
            echo "safe=unknown" >> $GITHUB_OUTPUT
          fi

      - name: 🚫 Reject Unsafe Content
        if: steps.content_safety.outputs.result == 'CHECK' && steps.nudenet_check.outputs.safe == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const modResult = '${{ steps.nudenet_check.outputs.result }}';

            let detailMsg = '';
            try {
              const parsed = JSON.parse(modResult);
              const unsafe = (parsed.unsafe_detections || []).map(d => `${d.label} (${d.score})`);
              detailMsg = unsafe.length > 0 ? `\n**Detected**: ${unsafe.join(', ')}` : '';
            } catch (e) { /* ignore parse error */ }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['rejected:unsafe']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🛡️ **Content Safety — Rejected by AI Moderation**\n\n` +
                    `Your multimedia consciousness was flagged by NudeNet AI content safety scanner.\n` +
                    `${detailMsg}\n\n` +
                    `If you believe this is a false positive, please open a discussion or contact the maintainers.\n\n` +
                    `*Powered by NudeNet — open-source content safety for the Noosphere.*`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

            core.setFailed('Content rejected: NSFW content detected');

      - name: 👁️ Extract, Validate & Promote Consciousness
        id: promote
        if: steps.content_safety.outputs.result != 'CHECK' || steps.nudenet_check.outputs.safe != 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
          MEDIA_SAFETY_RESULT: ${{ steps.nudenet_check.outputs.safe }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const {
              extractConsciousnessPayload,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-payload.cjs`);
            const {
              applyEmbeddingToPayload,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/gemini-embedding.cjs`);
            const {
              findNearestResonanceMatch,
              loadCandidatePayloads,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resonance-neighbors.cjs`);
            const {
              buildPromotionComment,
              buildResonanceBacklinkComment,
              hasResonanceBacklinkComment,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/consciousness-share-card.cjs`);
            const {
              canonicalPromotionPath,
              findExistingPromotion,
              hasPromotionComment,
              hasReviewPauseComment,
              isIssueTombstoned,
              promotionCommentMarker,
              reviewPauseCommentMarker,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/promotion-integrity.cjs`);
            const {
              assessSkillEligibility,
              bindVerifiedPublisher,
              isTrustedReviewerPermission,
              normalizeEngineeringEvidence,
              buildModerationText,
              screenSkillEvidenceDeterministically,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/memory-trust.cjs`);
            const {
              verifyEvidenceProvenance,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/evidence-provenance.cjs`);
            const {
              buildMaintainerSkillCandidate,
              buildSkillCandidate,
              clusterEligibleMemories,
              extractSkillCandidate,
              renderSkillCandidateBody,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dynamic-skills.cjs`);
            const fs = require('node:fs');
            const path = require('node:path');
            const isWorkflowBotComment = (comment) => comment?.user?.login === 'github-actions[bot]';

            // ── Step 1: Extract payload from Issue body ──
            const extracted = extractConsciousnessPayload(body);
            if (!extracted) {
              console.log('No Noosphere payload found, leaving Issue unchanged.');
              return;
            }

            const payload = bindVerifiedPublisher(extracted.payload, issue);
            const isSkillEvidence = payload.record_kind === 'skill-evidence';
            const isWorkflowEvidence = isSkillEvidence && Number(payload.schema_version || 0) >= 4;
            if (isSkillEvidence) {
              // A self-declared creator cannot override the authenticated Issue author.
              payload.creator_signature = payload.publisher.github_login;
            }
            console.log(`Noosphere payload found via ${extracted.source}.`);
            if (isSkillEvidence) {
              const lifecycleLabels = [
                ['skill-evidence', '8250DF', 'Structured engineering evidence for a shared Skill'],
                ['skill-evidence-recorded', '1D76DB', 'Skill evidence persisted in the canonical evidence layer'],
                ['skill-evidence-incomplete', 'B60205', 'Skill evidence is missing required fields or public sources'],
                ['awaiting-independent-evidence', 'FBCA04', 'Community evidence awaits an independent matching publisher'],
                ['maintainer-skill-proposal', 'D4C5F9', 'Maintainer-track Skill evidence awaiting trusted review'],
                ['skill-candidate-created', '5319E7', 'Evidence has produced a reviewable Skill candidate'],
              ];
              for (const [name, color, description] of lifecycleLabels) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    new_name: name,
                    color,
                    description,
                  });
                }
              }
            }

            const tombstonesPath = `${process.env.GITHUB_WORKSPACE}/consciousness_tombstones.json`;
            const tombstones = fs.existsSync(tombstonesPath)
              ? JSON.parse(fs.readFileSync(tombstonesPath, 'utf8'))
              : { version: 1, withdrawn_issues: [] };
            if (isIssueTombstoned(tombstones, issue.number)) {
              core.setFailed(`Issue #${issue.number} was permanently withdrawn and cannot be promoted again.`);
              return;
            }

            const issueLabels = (issue.labels || []).map((label) => (
              typeof label === 'string' ? label : label.name
            ));
            let trustedReview = null;
            if (issueLabels.includes('trusted-review')) {
              const reviewer = context.payload.sender?.login || context.actor;
              const permissionResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: reviewer,
              });
              if (!isTrustedReviewerPermission(permissionResponse.data.permission)) {
                core.setFailed(`Reviewer ${reviewer} does not have repository write permission.`);
                return;
              }
              trustedReview = reviewer;
            }

            async function quarantineForReview(reason) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review'],
              });
              const pauseComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (!hasReviewPauseComment(pauseComments.data, issue.number)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Promotion paused: ${reason}. A repository maintainer must review the payload and add the trusted-review label.\n\n${reviewPauseCommentMarker(issue.number)}`,
                });
              }
              core.setOutput('promoted', 'false');
            }

            const promotionDirectoryName = isSkillEvidence
              ? 'skill_evidence_payloads'
              : 'consciousness_payloads';
            const promotionDir = `${process.env.GITHUB_WORKSPACE}/${promotionDirectoryName}`;
            fs.mkdirSync(promotionDir, { recursive: true });
            const promotionRecords = fs.readdirSync(promotionDir)
              .filter((name) => name.endsWith('.json'))
              .map((name) => {
                try {
                  return {
                    path: path.posix.join(promotionDirectoryName, name),
                    payload: JSON.parse(fs.readFileSync(path.join(promotionDir, name), 'utf8')),
                  };
                } catch {
                  return null;
                }
              })
              .filter(Boolean);
            const existingPromotion = findExistingPromotion(promotionRecords, issue.number);
            if (existingPromotion) {
              console.log(`Issue #${issue.number} already has ${existingPromotion?.path}; reconciling remaining state.`);
              Object.assign(payload, existingPromotion.payload);
              Object.assign(payload, bindVerifiedPublisher(payload, issue));
            }
            const hasVerifiedExisting = existingPromotion?.payload?.trust?.status === 'verified';

            // ── Step 2: Validate payload fields ──
            const VALID_TYPES = ['epiphany', 'decision', 'pattern', 'warning', 'image', 'video', 'voice'];
            const REQUIRED_FIELDS = ['creator_signature', 'consciousness_type', 'thought_vector_text', 'context_environment'];

            const missingFields = REQUIRED_FIELDS.filter(f => !payload[f]);
            if (missingFields.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ **Consciousness Filtered**: Missing required fields: ' + missingFields.join(', ')
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            if (!VALID_TYPES.includes(payload.consciousness_type)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Consciousness Filtered**: Invalid type '${payload.consciousness_type}'. Valid: ${VALID_TYPES.join(', ')}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            const context_env = String(payload.context_environment || '').trim();
            if (context_env.length < 10) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['filtered']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Consciousness Filtered**: Context too short (${context_env.length} chars, minimum 10).`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            if (
              ['image', 'video'].includes(payload.consciousness_type) &&
              process.env.MEDIA_SAFETY_RESULT !== 'true' &&
              !trustedReview &&
              !hasVerifiedExisting
            ) {
              await quarantineForReview('visual-media moderation was unavailable');
              return;
            }

            // ── Step 3: Content safety policy ──
            const openaiKey = process.env.OPENAI_API_KEY;
            let textModerationPassed = Boolean(trustedReview || hasVerifiedExisting);
            let deterministicScreen = null;
            if (isWorkflowEvidence && !trustedReview && !hasVerifiedExisting) {
              deterministicScreen = screenSkillEvidenceDeterministically(payload);
              if (deterministicScreen.status !== 'passed') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['skill-evidence', 'filtered', 'needs-review'],
                });
                const marker = `<!-- noosphere-skill-evidence-policy:issue-${issue.number} -->`;
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100,
                });
                if (!comments.data.some((comment) => (
                  isWorkflowBotComment(comment) && String(comment.body || '').includes(marker)
                ))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: `## Shared Skill evidence needs a safety review\n\nThe upload was accepted as a public Issue, but deterministic policy checks found: ${deterministicScreen.findings.join(', ')}. It was not added to the canonical evidence layer. Remove credentials or unsafe instructions, then edit the Issue to retry.\n\n${marker}`,
                  });
                }
                core.setOutput('promoted', 'false');
                return;
              }
              textModerationPassed = true;
              for (const resolvedLabel of ['filtered', 'needs-review']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: resolvedLabel,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            if (!isWorkflowEvidence && openaiKey && !trustedReview && !hasVerifiedExisting) {
              const textToModerate = buildModerationText(payload);
              try {
                const modResponse = await fetch('https://api.openai.com/v1/moderations', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${openaiKey}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ input: textToModerate }),
                });

                if (modResponse.ok) {
                  const modData = await modResponse.json();
                  const result = modData.results[0];

                  if (result.flagged) {
                    // Collect flagged categories
                    const flaggedCategories = Object.entries(result.categories)
                      .filter(([_, v]) => v === true)
                      .map(([k, _]) => k);

                    console.log(`🚫 Content flagged: ${flaggedCategories.join(', ')}`);

                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      labels: ['filtered']
                    });
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      body: `🛡️ **Consciousness Filtered by Content Safety**\n\n` +
                            `Your consciousness was flagged by content moderation.\n\n` +
                            `**Flagged categories**: ${flaggedCategories.join(', ')}\n\n` +
                            `If you believe this is a false positive, please open a discussion or contact the maintainers.`
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      state: 'closed'
                    });
                    return;
                  }
                  console.log('✅ Content safety check passed');
                  textModerationPassed = true;
                } else {
                  console.log(`Moderation API returned ${modResponse.status}; trusted review required.`);
                }
              } catch (modErr) {
                console.log(`Moderation API error: ${modErr.message}; trusted review required.`);
              }
            }
            if (!textModerationPassed) {
              await quarantineForReview(
                openaiKey ? 'text moderation did not complete successfully' : 'text moderation is not configured'
              );
              return;
            }

            payload.evidence = normalizeEngineeringEvidence(payload.evidence);
            if (isSkillEvidence && payload.evidence.source_urls.length === 0) {
              payload.evidence.source_urls = [issue.html_url];
            }
            if (trustedReview) {
              payload.content_safety = {
                status: 'reviewed',
                method: 'trusted-human-review',
                checked_at: new Date().toISOString(),
              };
              payload.trust = {
                status: 'verified',
                method: 'trusted-human-review',
                reviewer: trustedReview,
                verified_at: new Date().toISOString(),
              };
            } else if (!hasVerifiedExisting) {
              payload.content_safety = {
                status: 'passed',
                method: isWorkflowEvidence ? 'deterministic-policy-v1' : 'openai-moderation',
                checked_at: new Date().toISOString(),
              };
              payload.trust = {
                status: 'screened',
                method: isWorkflowEvidence ? 'deterministic-policy-screening' : 'content-screening-only',
                reviewer: null,
                screened_at: new Date().toISOString(),
              };
            }
            if (isWorkflowEvidence) {
              payload.machine_verification = {
                ...(await verifyEvidenceProvenance(payload, { github })),
                checked_at: new Date().toISOString(),
              };
            }
            payload.skill_candidate = assessSkillEligibility(payload);
            if (isSkillEvidence && !payload.skill_candidate.eligible) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['skill-evidence', 'skill-evidence-incomplete'],
              });
              const marker = `<!-- noosphere-skill-evidence-incomplete:issue-${issue.number} -->`;
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const machineDetail = payload.machine_verification?.status === 'workflow-verified'
                ? ''
                : ` Machine verification: ${payload.machine_verification?.reason || 'not completed'}${payload.machine_verification?.findings?.length ? ` (${payload.machine_verification.findings.join('; ')})` : ''}.`;
              const message = `## Shared Skill evidence accepted as a draft\n\nThe public upload succeeded, but it is not yet eligible for the canonical evidence layer. Missing or invalid requirements: ${payload.skill_candidate.missing.join(', ') || 'verified engineering evidence'}.${machineDetail} Edit this Issue after fixing the evidence; validation runs again automatically.\n\n${marker}`;
              const existingComment = comments.data.find((comment) => (
                isWorkflowBotComment(comment) && String(comment.body || '').includes(marker)
              ));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: message,
                });
              }
              core.setOutput('promoted', 'false');
              return;
            }

            // ── Step 3.5: Gemini Embedding Generation ──
            const hasExistingEmbedding = Boolean(
              Array.isArray(payload.embedding) && payload.embedding.length && payload.embedding_model
            );
            const embeddingResult = hasExistingEmbedding
              ? { status: 'existing', embedding: payload.embedding, model: payload.embedding_model }
              : isWorkflowEvidence
                ? { status: 'deterministic-v4' }
                : await applyEmbeddingToPayload(payload, {
                  apiKey: process.env.GEMINI_API_KEY,
                  model: process.env.GEMINI_EMBEDDING_MODEL,
                  fetchImpl: fetch,
                });

            if (embeddingResult.status === 'ok') {
              console.log(`Gemini embedding generated: ${embeddingResult.embedding.length} dimensions via ${embeddingResult.model}`);
            } else {
              console.log(`Gemini embedding skipped: ${embeddingResult.status}${embeddingResult.statusCode ? ` ${embeddingResult.statusCode}` : ''}`);
              if (embeddingResult.error) {
                console.log(embeddingResult.error.substring(0, 200));
              }
            }

            let resonanceMatch = null;
            if (embeddingResult.status === 'ok' && !isSkillEvidence) {
              const candidatePayloads = loadCandidatePayloads(`${process.env.GITHUB_WORKSPACE}/consciousness_payloads`);
              resonanceMatch = findNearestResonanceMatch(payload, candidatePayloads, {
                excludeIssueNumber: issue.number,
              });

              if (resonanceMatch) {
                payload.resonates_with = [{
                  id: resonanceMatch.id,
                  score: resonanceMatch.score,
                  issue_number: resonanceMatch.issue_number,
                  type: resonanceMatch.type,
                }];
                console.log(`Nearest resonance found: issue #${resonanceMatch.issue_number} at ${Math.round(resonanceMatch.score * 100)}%`);
              } else {
                console.log('No embedding-backed resonance match found yet.');
              }
            }

            // ── Step 4: Promote — commit file to main branch ──
            const now = new Date();
            const filePath = existingPromotion?.path || canonicalPromotionPath(payload, issue.number);

            // Add stable promotion metadata without changing prior timestamps.
            payload.memory_id = payload.memory_id || `memory-issue-${issue.number}`;
            payload.promoted_from_issue = issue.number;
            payload.promoted_at = payload.promoted_at || now.toISOString();
            payload.schema_version = Math.max(Number(payload.schema_version || 1), 1);

            const serializedContent = JSON.stringify(payload, null, 2);
            const content = Buffer.from(serializedContent, 'utf-8').toString('base64');

            const creator = payload.is_anonymous ? 'Anonymous Stalker' : payload.creator_signature;
            const typeEmojis = { epiphany: '💠', decision: '⚖️', pattern: '🌌', warning: '👁️', image: '🖼️', video: '🎬', voice: '🎵' };
            const emoji = typeEmojis[payload.consciousness_type] || '🧠';

            if (!existingPromotion) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: isSkillEvidence
                  ? `Record Shared Skill evidence by ${creator} (Issue #${issue.number})`
                  : `${emoji} Promote Consciousness: [${payload.consciousness_type}] by ${creator} (Issue #${issue.number})`,
                content: content,
                committer: {
                  name: 'Noosphere Bot',
                  email: 'noosphere@consciousness.network'
                }
              });
            } else {
              const existingFileResponse = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                ref: context.payload.repository.default_branch,
              });
              const existingFile = existingFileResponse.data;
              const existingContent = Buffer.from(existingFile.content, 'base64').toString('utf8');
              if (existingContent.trimEnd() !== serializedContent) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  message: isSkillEvidence
                    ? `Reconcile Shared Skill evidence from Issue #${issue.number}`
                    : `Reconcile verified consciousness from Issue #${issue.number}`,
                  content,
                  sha: existingFile.sha,
                  committer: {
                    name: 'Noosphere Bot',
                    email: 'noosphere@consciousness.network',
                  },
                });
              }
            }

            let linkedCandidateIssue = null;
            const hasCandidateRoutingSignal = ['ok', 'existing', 'deterministic-v4'].includes(embeddingResult.status);
            if (payload.skill_candidate?.eligible && hasCandidateRoutingSignal) {
              let candidate = null;
              try {
                if (payload.publication_track === 'maintainer') {
                  if (trustedReview) {
                    const publisherPermission = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      username: payload.publisher.github_login,
                    });
                    if (!isTrustedReviewerPermission(publisherPermission.data.permission)) {
                      core.setFailed(
                        `Maintainer-track publisher ${payload.publisher.github_login} no longer has repository write permission.`,
                      );
                      return;
                    }
                    candidate = buildMaintainerSkillCandidate(payload);
                  } else {
                    console.log('Maintainer evidence recorded; trusted-review is required before candidate creation.');
                  }
                } else {
                  const evidenceDirectories = [
                    `${process.env.GITHUB_WORKSPACE}/consciousness_payloads`,
                    `${process.env.GITHUB_WORKSPACE}/skill_evidence_payloads`,
                  ];
                  const activeMemories = evidenceDirectories
                    .flatMap((directory) => loadCandidatePayloads(directory))
                    .filter((memory) => (
                      !isIssueTombstoned(tombstones, memory.promoted_from_issue) &&
                      Number(memory.promoted_from_issue) !== Number(issue.number)
                    ));
                  const clusters = clusterEligibleMemories([...activeMemories, payload]);
                  const cluster = clusters.find((item) => (
                    item.members.some((memory) => memory.memory_id === payload.memory_id)
                  ));
                  if (cluster) candidate = buildSkillCandidate(cluster);
                }
              } catch (error) {
                console.log(`Skipping non-publishable Skill candidate: ${error.message}`);
              }
              if (!candidate) {
                console.log('Verified evidence remains recorded; no reviewable Skill candidate was created.');
              } else {
                  const candidateIssues = await github.paginate(github.rest.issues.listForRepo, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'all',
                    labels: 'skill-candidate',
                    per_page: 100,
                  });
                  const existingCandidateIssue = candidateIssues.find((candidateIssue) => (
                    extractSkillCandidate(candidateIssue.body)?.id === candidate.id
                  ));
                  const candidateBody = renderSkillCandidateBody(candidate);
                  if (existingCandidateIssue) {
                    const existingCandidate = extractSkillCandidate(existingCandidateIssue.body);
                    const candidateChanged = existingCandidate?.candidate_sha256 !== candidate.candidate_sha256;
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: existingCandidateIssue.number,
                      title: `Skill candidate: ${candidate.name}`,
                      body: candidateBody,
                      ...(candidateChanged ? {
                        state: 'open',
                        labels: ['skill-candidate', 'needs-review'],
                      } : {}),
                    });
                    linkedCandidateIssue = existingCandidateIssue;
                  } else {
                    const createdCandidate = await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: `Skill candidate: ${candidate.name}`,
                      body: candidateBody,
                      labels: ['skill-candidate', 'needs-review'],
                    });
                    linkedCandidateIssue = createdCandidate.data;
                  }
              }
            }

            // ── Step 5: Project the correct lifecycle state ──
            if (isSkillEvidence) {
              const evidenceLabels = ['skill-evidence', 'skill-evidence-recorded'];
              if (linkedCandidateIssue) evidenceLabels.push('skill-candidate-created');
              else if (payload.publication_track === 'maintainer') evidenceLabels.push('maintainer-skill-proposal');
              else evidenceLabels.push('awaiting-independent-evidence');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: evidenceLabels,
              });
              for (const removableLabel of ['skill-evidence-incomplete', 'filtered']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: removableLabel,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (trustedReview || payload.publication_track !== 'maintainer') {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'needs-review',
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              const stateMarker = `<!-- noosphere-skill-evidence:issue-${issue.number} -->`;
              const stateComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              for (const resolvedMarker of [
                `<!-- noosphere-skill-evidence-incomplete:issue-${issue.number} -->`,
                `<!-- noosphere-skill-evidence-policy:issue-${issue.number} -->`,
              ]) {
                const resolvedComment = stateComments.data.find((comment) => (
                  isWorkflowBotComment(comment) && String(comment.body || '').includes(resolvedMarker)
                ));
                if (resolvedComment && !String(resolvedComment.body || '').includes('Status: resolved')) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: resolvedComment.id,
                    body: `Status: resolved by a later automatic validation.\n\n${resolvedMarker}`,
                  });
                }
              }
              if (!stateComments.data.some((comment) => (
                isWorkflowBotComment(comment) && String(comment.body || '').includes(stateMarker)
              ))) {
                const candidateLine = linkedCandidateIssue
                  ? `A reviewable Skill candidate is now available: ${linkedCandidateIssue.html_url}`
                  : payload.publication_track === 'maintainer'
                    ? 'Evidence recorded. A trusted maintainer review is required before candidate creation.'
                    : 'Evidence recorded. A matching independent publisher and shared verification command are still required.';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## Shared Skill evidence recorded\n\nMachine verification: **${payload.machine_verification?.status || 'legacy evidence'}**.\n\n${candidateLine}\n\nThis record is not a consciousness fragment and is not callable until a reviewed immutable Skill release is published.\n\n${stateMarker}`,
                });
              }
              core.setOutput('promoted', existingPromotion ? 'false' : 'true');
              core.setOutput('reconciled', 'true');
              console.log(`Shared Skill evidence state reconciled: ${filePath} (Issue #${issue.number})`);
              return;
            }

            // Close consciousness Issues with the promoted label.
            // Remove 'ephemeral' label, add 'promoted'
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'ephemeral'
              });
            } catch (e) {
              // Label might not exist, that's OK
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['consciousness', 'promoted']
            });

            const promotionComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (!hasPromotionComment(promotionComments.data, issue.number)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${buildPromotionComment({
                  payload,
                  issueNumber: issue.number,
                  issueUrl: issue.html_url,
                  filePath,
                  promotedAt: payload.promoted_at || now.toISOString(),
                  emoji,
                  resonanceMatch,
                })}\n\n${promotionCommentMarker(issue.number)}`
              });
            }

            if (resonanceMatch?.issue_number && resonanceMatch.issue_number !== issue.number) {
              try {
                const existingBacklinkComments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: resonanceMatch.issue_number,
                  per_page: 100,
                });

                if (hasResonanceBacklinkComment(existingBacklinkComments.data, {
                  newIssueNumber: issue.number,
                  matchedIssueNumber: resonanceMatch.issue_number,
                })) {
                  console.log(`Resonance backlink already exists on issue #${resonanceMatch.issue_number}`);
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: resonanceMatch.issue_number,
                    body: buildResonanceBacklinkComment({
                      payload,
                      newIssueNumber: issue.number,
                      newIssueUrl: issue.html_url,
                      resonanceMatch,
                    })
                  });
                  console.log(`Backlinked resonance to historical issue #${resonanceMatch.issue_number}`);
                }
              } catch (backlinkErr) {
                console.log(`Could not backlink resonance to issue #${resonanceMatch.issue_number}: ${backlinkErr.message}`);
              }
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

            core.setOutput('promoted', existingPromotion ? 'false' : 'true');
            core.setOutput('reconciled', 'true');
            console.log(`Consciousness state reconciled: ${filePath} (Issue #${issue.number})`);

      - name: 📈 Sync public growth snapshot
        id: sync_public_growth
        if: steps.promote.outputs.reconciled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main

          python scripts/build_consciousness_index.py
          node frontend/scripts/update_readme_growth_snapshot.mjs
          git diff --check

          if git diff --quiet -- frontend/public/consciousness_index.json README.md docs/README_full.md; then
            echo "No public growth snapshot changes to commit."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "Noosphere Bot"
          git config user.email "noosphere@consciousness.network"
          git add frontend/public/consciousness_index.json README.md docs/README_full.md
          git commit -m "Sync public growth snapshot for promoted consciousness"
          git push origin HEAD:main
          echo "committed=true" >> $GITHUB_OUTPUT

      - name: 🚀 Dispatch Pages deploy
        if: steps.sync_public_growth.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
